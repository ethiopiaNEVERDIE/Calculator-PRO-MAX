
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator PRO MAX</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#020617);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
}

.calculator{
    background:#111827;
    border-radius:25px;
    padding:20px;
    box-shadow:0 0 30px rgba(0,255,136,.15);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.clock{
    color:#00ff88;
    font-weight:bold;
}

.display{
    width:100%;
    height:90px;
    border:none;
    outline:none;
    background:#1f2937;
    color:#fff;
    font-size:2rem;
    text-align:right;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
}

button{
    height:58px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

.num{
    background:#374151;
    color:white;
}

.op{
    background:#f59e0b;
    color:white;
}

.func{
    background:#2563eb;
    color:white;
}

.equal{
    background:#10b981;
    color:white;
}

.clear{
    background:#ef4444;
    color:white;
}

.history{
    margin-top:20px;
    background:#1f2937;
    padding:12px;
    border-radius:12px;
    max-height:200px;
    overflow:auto;
}

.history h3{
    margin-bottom:10px;
}

.history-item{
    margin-bottom:5px;
    color:#d1d5db;
}

.footer{
    margin-top:20px;
    text-align:center;
}

.brand{
    color:#00ff88;
    font-weight:bold;
    margin-bottom:10px;
}

.socials a{
    color:#ff66c4;
    text-decoration:none;
    margin:0 10px;
}

.socials a:hover{
    text-shadow:0 0 10px #ff66c4;
}

.theme-btn{
    background:#9333ea;
    color:white;
    padding:8px 12px;
}

.light{
    background:#f4f4f4;
    color:#111;
}

.light .calculator{
    background:white;
}

.light .display{
    background:#e5e7eb;
    color:#111;
}

.light .history{
    background:#e5e7eb;
    color:#111;
}

@media(max-width:700px){
    .buttons{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>
<body>

<div class="container">

<div class="calculator">

<div class="topbar">
<div class="clock" id="clock"></div>
<button class="theme-btn" onclick="toggleTheme()">Theme</button>
</div>

<div class="buttons">

<button class="func" onclick="backspace()">⌫</button>

<button class="func" onclick="append(')')">)</button>
<button class="func" onclick="append('%')">%</button>
<button class="func" onclick="copyResult()">Copy</button>

<button class="func" onclick="append('Math.PI')">π</button>
<button class="func" onclick="append('Math.E')">e</button>
<button class="func" onclick="append('Math.sin(')">sin</button>
<button class="func" onclick="append('Math.cos(')">cos</button>
<button class="func" onclick="append('Math.tan(')">tan</button>
<button class="func" onclick="append('Math.sqrt(')">√</button>

<button class="func" onclick="append('Math.asin(')">asin</button>
<button class="func" onclick="append('Math.acos(')">acos</button>
<button class="func" onclick="append('Math.atan(')">atan</button>
<button class="func" onclick="append('Math.log10(')">log</button>
<button class="func" onclick="append('Math.log(')">ln</button>
<button class="func" onclick="append('Math.exp(')">exp</button>

<button class="num" onclick="append('7')">7</button>
<button class="num" onclick="append('8')">8</button>
<button class="num" onclick="append('9')">9</button>
<button class="op" onclick="append('/')">÷</button>

<button class="func" onclick="cube()">x³</button>

<button class="num" onclick="append('5')">5</button>
<button class="num" onclick="append('6')">6</button>
<button class="op" onclick="append('*')">×</button>
<button class="func" onclick="power()">xʸ</button>
<button class="func" onclick="inverse()">1/x</button>

<button class="num" onclick="append('1')">1</button>
<button class="num" onclick="append('2')">2</button>
<button class="num" onclick="append('3')">3</button>
<button class="op" onclick="append('-')">−</button>
<button class="func" onclick="factorial()">n!</button>
<button class="func" onclick="absolute()">|x|</button>

<button class="num" onclick="append('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>

<script>

const display=document.getElementById("display");
const historyList=document.getElementById("historyList");

function append(v){
display.value+=v;
}

function clearDisplay(){
display.value="";
}

function backspace(){
display.value=display.value.slice(0,-1);
}

function calculate(){
try{
let expr=display.value.replace(/%/g,"/100");
let result=eval(expr);

addHistory(display.value+" = "+result);

display.value=result;
}
catch{
display.value="Error";
}
}

function square(){
display.value=Math.pow(eval(display.value),2);
}

function cube(){
display.value=Math.pow(eval(display.value),3);
}

function inverse(){
display.value=1/eval(display.value);
}

function power(){
append("**");
}

function absolute(){
display.value=Math.abs(eval(display.value));
}

function factorial(){

let n=parseInt(eval(display.value));

if(n<0){
display.value="Error";
return;
}

let result=1;

for(let i=2;i<=n;i++){
result*=i;
}

display.value=result;
}

function randomNumber(){
display.value=Math.random();
}

function copyResult(){
navigator.clipboard.writeText(display.value);
alert("Copied");
}

function addHistory(text){

let div=document.createElement("div");

div.className="history-item";
div.textContent=text;

historyList.prepend(div);

localStorage.setItem(
"calcHistory",
historyList.innerHTML
);
}

function clearHistory(){

historyList.innerHTML="";

localStorage.removeItem("calcHistory");
}

window.onload=()=>{

historyList.innerHTML=
localStorage.getItem("calcHistory")||"";

}

function toggleTheme(){
document.body.classList.toggle("light");
}

setInterval(()=>{

const now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleString();

},1000);

document.addEventListener("keydown",e=>{

if("0123456789+-*/().".includes(e.key)){
append(e.key);
}

if(e.key==="Enter"){
calculate();
}

if(e.key==="Backspace"){
backspace();
}

if(e.key==="Escape"){
clearDisplay();
}

});

</script>

</body>
</html>
